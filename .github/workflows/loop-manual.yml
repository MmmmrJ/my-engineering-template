name: Loop manual report

on:
  workflow_dispatch:
    inputs:
      pattern:
        description: Enabled L1 pattern to run
        required: true
        type: choice
        options:
          - harness-health
          - daily-triage
        default: harness-health

permissions:
  contents: read

concurrency:
  group: loop-${{ inputs.pattern }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Execute selected report-only pattern
        env:
          PATTERN: ${{ inputs.pattern }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node scripts/harness/cli.mjs loop run execute "$PATTERN" \
            --run-id "${PATTERN}-${RUN_ID}-${RUN_ATTEMPT}" \
            --slot "${PATTERN}:${RUN_ID}:${RUN_ATTEMPT}" \
            --trigger manual \
            --actor github-actions \
            --json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loop-${{ inputs.pattern }}-${{ github.run_id }}
          path: |
            STATE.md
            loop-run-log.md
            .harness/runtime/runs/*.json
            .harness/runtime/ledgers/*.json
            .harness/runtime/state.json
          if-no-files-found: warn

name: Harness verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/harness/run-tests.mjs
      - run: node scripts/harness/cli.mjs sync-agents --check
      - run: node scripts/harness/cli.mjs guard-secrets --tracked
      - run: node scripts/harness/cli.mjs doctor --strict
      - run: node scripts/harness/cli.mjs verify --profile ci

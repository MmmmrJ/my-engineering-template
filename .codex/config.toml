# Codex project harness defaults.
# After clone: trust hooks once via /hooks in Codex if prompted.
# Docs: https://developers.openai.com/codex/hooks

sandbox_mode = "workspace-write"
approval_policy = "on-request"

[env]
# Prefer ${VAR} references; keep secrets in .env (not committed).

# Session start: re-inject durable pointers
[[hooks.SessionStart]]
matcher = "startup|resume|clear|compact"

[[hooks.SessionStart.hooks]]
type = "command"
command = 'node "$(git rev-parse --show-toplevel)/scripts/harness/cli.mjs" session'
timeout = 15
statusMessage = "Loading harness session context"

# Block dangerous bash before execution
[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'node "$(git rev-parse --show-toplevel)/scripts/harness/cli.mjs" guard'
timeout = 20
statusMessage = "Checking Bash command"

# Completion gate
[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = 'node "$(git rev-parse --show-toplevel)/scripts/harness/cli.mjs" verify --profile fast'
timeout = 120
statusMessage = "Running completion verify"
